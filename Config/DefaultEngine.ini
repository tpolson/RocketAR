[/Script/Engine.RendererSettings]
; Alpha propagation through post-processing pipeline (required for fill/key output)
r.PostProcessing.PropagateAlpha=1
; 64-bit float RGBA scene color format (includes alpha channel)
r.SceneColorFormat=0
; FXAA only — TAA causes alpha ghosting at edges
r.AntiAliasingMethod=1
; Disable auto-exposure (fluctuations interact with premultiplied alpha)
r.DefaultFeature.AutoExposure=False
r.EyeAdaptation.EditorOnly=0
; Fixed manual exposure so scene isn't black with auto-exposure off
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.Bias=0.0
; Disable post-process effects that corrupt alpha
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.MotionBlurQuality=0
r.FilmGrain.Intensity=0
; Disable lens effects
r.DefaultFeature.LensFlare=False
; Disable screen space reflections
r.SSR.Quality=0

[/Script/Engine.Engine]
